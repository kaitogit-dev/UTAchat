services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: utachat
      POSTGRES_PASSWORD: utachat-local-only
      POSTGRES_DB: utachat
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - utachat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utachat -d utachat"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  utachat_pgdata:
