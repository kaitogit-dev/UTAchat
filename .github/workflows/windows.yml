name: UTAchat CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: utachat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: utachat
          POSTGRES_PASSWORD: runner-password
          POSTGRES_DB: utachat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U utachat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://utachat:runner-password@127.0.0.1:5432/utachat
      PORT: 4811
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build backend
        run: cargo build -p utachat-server
      - name: Verify PostgreSQL persistence
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time, urllib.error, urllib.request

          base = "http://127.0.0.1:4811"
          executable = ["target/debug/utachat-server"]

          def start():
              process = subprocess.Popen(executable, env=os.environ)
              for _ in range(100):
                  try:
                      if request("GET", "/v1/health")["service"] == "utachat":
                          return process
                  except Exception:
                      time.sleep(0.1)
              process.kill()
              raise RuntimeError("Backend did not become healthy")

          def request(method, path, body=None, token=None):
              data = None if body is None else json.dumps(body).encode()
              headers = {"Content-Type": "application/json"}
              if token:
                  headers["Authorization"] = "Bearer " + token
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=5) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None

          process = start()
          try:
              auth = request("POST", "/v1/auth/register", {"username": "utachatci", "password": "BuildCheckPassword123!"})
              token = auth["token"]
              server = request("POST", "/v1/servers", {"name": "CI community"}, token)
              channels = request("GET", "/v1/servers/" + server["id"] + "/channels", token=token)
              channel = channels[0]
              posted = request("POST", "/v1/channels/" + channel["id"] + "/messages", {"content": "Persisted message"}, token)
              assert posted["content"] == "Persisted message"
              edited = request("PATCH", "/v1/channels/" + channel["id"] + "/messages/" + posted["id"], {"content": "Edited and persisted"}, token)
              assert edited["edited_at"] and edited["content"] == "Edited and persisted"
              reaction = request("POST", "/v1/channels/" + channel["id"] + "/messages/" + posted["id"] + "/reactions", {"kind": "like"}, token)
              reply = request("POST", "/v1/channels/" + channel["id"] + "/messages", {"content": "Reply", "reply_to": posted["id"]}, token)
              assert reply["reply_to"] == posted["id"]
              auth2 = request("POST", "/v1/auth/register", {"username": "utachatci2", "password": "AnotherStrongPassword123!"})
              token2 = auth2["token"]
              invite = request("GET", "/v1/servers/" + server["id"] + "/invite", token=token)
              request("POST", "/v1/invites/" + invite["code"] + "/join", token=token2)
              request("POST", "/v1/friends/requests", {"username": "utachatci2"}, token)
              requests2 = request("GET", "/v1/friends", token=token2)
              assert len(requests2) == 1 and requests2[0]["incoming"]
              request("POST", "/v1/friends/" + auth["user"]["id"] + "/accept", token=token2)
              accepted = request("GET", "/v1/friends", token=token)
              assert accepted[0]["status"] == "accepted"
              dm = request("POST", "/v1/dms", {"username": "utachatci2"}, token)
              dm_message = request("POST", "/v1/dms/" + dm["id"] + "/messages", {"content": "Secret DM"}, token)
              dm_list = request("GET", "/v1/dms/" + dm["id"] + "/messages", token=token2)
              assert len(dm_list) == 1 and dm_list[0]["id"] == dm_message["id"]
              dm_edit = request("PATCH", "/v1/dms/" + dm["id"] + "/messages/" + dm_message["id"], {"content": "Edited DM"}, token)
              assert dm_edit["edited_at"]
              dm_reply = request("POST", "/v1/dms/" + dm["id"] + "/messages", {"content": "DM reply", "reply_to": dm_message["id"]}, token=token2)
              assert dm_reply["reply_to"] == dm_message["id"]
              request("DELETE", "/v1/dms/" + dm["id"] + "/messages/" + dm_reply["id"], token=token2)
              assert len(request("GET", "/v1/dms/" + dm["id"] + "/messages", token=token)) == 1
              process.terminate()
              process.wait(timeout=10)
              process = start()
              assert request("GET", "/v1/me", token=token)["username"] == "utachatci"
              messages = request("GET", "/v1/channels/" + channel["id"] + "/messages", token=token)
              assert any(message["id"] == posted["id"] and message["content"] == "Edited and persisted" and message["reactions"][0]["count"] == 1 for message in messages)
              assert len(request("GET", "/v1/dms/" + dm["id"] + "/messages", token=token2)) == 1
          finally:
              process.terminate()
              try:
                  process.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  process.kill()
          PY

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build Windows client
        shell: pwsh
        run: cargo build --release -p utachat --target x86_64-pc-windows-msvc
      - name: Verify Windows UI executable
        shell: pwsh
        run: |
          $path = "target/x86_64-pc-windows-msvc/release/utachat.exe"
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $path))
          $header = [BitConverter]::ToInt32($bytes, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($bytes, $header + 24 + 68)
          if ($subsystem -ne 2) { throw "UTAchat.exe must be a GUI application" }
      - name: Package online client
        shell: pwsh
        run: |
          $config = Get-Content config.json -Raw | ConvertFrom-Json
          if (-not $config.api_url.StartsWith("https://")) { throw "Online API URL must be HTTPS" }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/utachat.exe dist/UTAchat.exe
          Copy-Item config.json dist/config.json
      - uses: actions/upload-artifact@v4
        with:
          name: UTAchat-Windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30
